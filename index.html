<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DİN Mərkəzi Operativ Qərargah</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --bg-card: #151922;
            --bg-chat: #1a1f2c;
            --accent-gold: #d4af37;
            --accent-blue: #2563eb;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --danger-red: #ef4444;
            --border-color: #272f3f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* GİRİŞ PORTALI */
        #login-overlay { position: fixed; inset: 0; background: #07090e; display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 20px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--accent-gold); padding: 25px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .login-card h2 { color: var(--accent-gold); font-size: 1.2rem; margin-bottom: 5px; }
        .login-card h3 { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; outline: none; font-size: 0.9rem; }
        .login-card button { width: 100%; padding: 12px; background: var(--accent-blue); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* YUXARI STATUS PANELİ */
        header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 10px 15px; display: flex; flex-direction: column; gap: 6px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .header-title { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }
        .status-row { display: flex; gap: 8px; overflow-x: auto; font-size: 0.75rem; padding-bottom: 2px; }
        .status-badge { background: var(--bg-dark); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
        .status-badge span { color: var(--accent-gold); font-weight: bold; }

        /* ƏSAS DÜZƏLİŞ VƏ MOBİL KEÇİDLƏR */
        .app-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* SOL MENYU (ÇAT SİYAHISI) */
        .sidebar { width: 100%; max-width: 340px; background: var(--bg-card); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; transition: transform 0.3s ease; }
        .sidebar-title { padding: 12px 15px; font-size: 0.8rem; font-weight: bold; color: var(--accent-gold); text-transform: uppercase; border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); }
        .chat-list { overflow-y: auto; flex: 1; }
        .chat-item { padding: 12px 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .chat-item.active { background: var(--bg-chat); border-left: 3px solid var(--accent-gold); }
        .chat-name { font-size: 0.85rem; font-weight: bold; color: #fff; }
        .chat-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .unread-dot { width: 8px; height: 8px; background: var(--danger-red); border-radius: 50%; display: none; }
        .unread-dot.active { display: block; }

        /* SAĞ ÇAT PƏNCƏRƏSİ */
        .chat-view { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); position: absolute; inset: 0; transform: translateX(100%); transition: transform 0.3s ease; }
        .chat-view.active-view { transform: translateX(0); }

        @media (min-width: 768px) {
            .sidebar { max-width: 320px; }
            .chat-view { position: relative; transform: none !important; }
            .back-btn { display: none !important; }
        }

        .chat-header { padding: 10px 15px; background: var(--bg-card); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .back-btn { background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; margin-right: 10px; }
        .chat-header-info { flex: 1; }
        .chat-header-title { font-size: 0.9rem; font-weight: bold; color: #fff; }
        .chat-header-sub { font-size: 0.75rem; color: var(--text-muted); }

        .messages-area { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.4; }
        .msg.received { background: var(--bg-card); border: 1px solid var(--border-color); align-self: flex-start; }
        .msg.sent { background: var(--accent-blue); color: #fff; align-self: flex-end; }
        .msg-sender { font-size: 0.7rem; font-weight: bold; color: var(--accent-gold); margin-bottom: 3px; }

        .input-bar { padding: 10px 15px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .input-bar input { flex: 1; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 8px; outline: none; font-size: 0.85rem; }
        .input-bar button { padding: 10px 15px; background: var(--accent-blue); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal { background: var(--bg-card); border: 1px solid var(--accent-gold); width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; }
        .modal h3 { color: var(--accent-gold); font-size: 1rem; margin-bottom: 15px; }
        .modal select, .modal input { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; margin-bottom: 10px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .modal-btns button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

    <!-- GİRİŞ EKRANI -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>DİN OPERATİV PORTALI</h2>
            <h3>MƏXFİ NAZİR GİRİŞİ</h3>
            <input type="text" id="login-user" placeholder="İstifadəçi Adı">
            <input type="password" id="login-pass" placeholder="Kod">
            <button onclick="login()">DAXİL OL</button>
            <p id="login-err" style="color:var(--danger-red); font-size:0.75rem; margin-top:10px; display:none;">Giriş məlumatları yanlışdır!</p>
        </div>
    </div>

    <!-- YUXARI PANEL -->
    <header>
        <div class="header-top">
            <div class="header-title">DİN MƏRKƏZİ QƏRARGAH</div>
            <div style="font-size: 0.75rem; color: var(--accent-gold);" id="clock">00:00</div>
        </div>
        <div class="status-row">
            <div class="status-badge">Vəzifə: <span>Daxili İşlər Naziri</span></div>
            <div class="status-badge">Maaş Balansı: <span id="b-legal">15,000 AZN</span></div>
            <div class="status-badge">Xüsusi Fond: <span id="b-black">120,000 AZN</span></div>
            <div class="status-badge">PA Nüfuzu: <span id="rep">95%</span></div>
        </div>
    </header>

    <!-- ƏSAS İNTERFEYS -->
    <div class="app-body">
        <!-- SOL MENYU -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-title">Dövlət və DİN Strukturları</div>
            <div class="chat-list" id="chat-list"></div>
        </div>

        <!-- SAĞ ÇAT -->
        <div class="chat-view" id="chat-view">
            <div class="chat-header">
                <button class="back-btn" onclick="closeChatMobile()">◀ Çatlar</button>
                <div class="chat-header-info">
                    <div class="chat-header-title" id="chat-title">Prezident Administrasiyası</div>
                    <div class="chat-header-sub" id="chat-sub">Ali Baş Komandanlıq</div>
                </div>
                <button style="background:var(--bg-dark); border:1px solid var(--border-color); color:#fff; padding:6px 10px; border-radius:6px; font-size:0.75rem;" onclick="openModal()">Kadrlar</button>
            </div>

            <div class="messages-area" id="msg-area"></div>

            <div class="input-bar">
                <input type="text" id="msg-input" placeholder="Əmr və ya cavabınızı yazın..." onkeypress="if(event.key==='Enter') sendMsg()">
                <button onclick="sendMsg()">></button>
            </div>
        </div>
    </div>

    <!-- KADR MODALI -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Kadr İdarəetməsi</h3>
            <label style="font-size:0.75rem; color:var(--text-muted)">Cari Rəis:</label>
            <input type="text" id="modal-officer" readonly>
            <select id="modal-action" onchange="toggleKadrInput()">
                <option value="fire">Vəzifədən Azad Et (Sərəncama Al)</option>
                <option value="promote">Rütbəsini Qaldır</option>
                <option value="replace">Yeni Rəis Təyin Et</option>
            </select>
            <input type="text" id="modal-new-name" placeholder="Yeni rəisin adı soyadı" style="display:none;">
            <div class="modal-btns">
                <button style="background:var(--danger-red); color:#fff;" onclick="closeModal()">Ləğv Et</button>
                <button style="background:var(--accent-blue); color:#fff;" onclick="applyKadr()">Təsdiqlə</button>
            </div>
        </div>
    </div>

    <script>
        const AUTH_U = "K9ESCOBAR211_";
        const AUTH_P = "AA555_67";

        // BÜTÜN QURUMLARIN TAM SİYAHISI
        const initialChats = [
            { id: "pa", name: "Prezident Administrasiyası", sub: "PA Şöbə Müdiri", officer: "Cənab Məsləhətçi", unread: false, history: [{ sender: "PA Müdiri", text: "Cənab Nazir, ölkədəki təhlükəsizlik vəziyyəti ilə bağlı hesabat gözlənilir." }] },
            { id: "home", name: "🏠 Şəxsi Kabinet / Evim", sub: "Şəxsi Mülkiyyət və Əmlak", officer: "Şəxsi Köməkçi", unread: false, history: [{ sender: "Köməkçi", text: "Cənab Nazir, villanızda təhlükəsizlik sistemləri yeniləndi. Qarajda 3 xidməti avtomobil hazırdır." }] },
            { id: "deputies", name: "DİN Müavinləri", sub: "1-ci Müavin və Müavinlər", officer: "General-leytenant İ. Məmmədov", unread: false, history: [{ sender: "1-ci Müavin", text: "Cənab Nazir, bütün DİN strukturları tapşırıqlarınızı gözləyir." }] },
            { id: "bdypi", name: "Baş Dövlət Yol Polisi İdarəsi", sub: "BDYPİ", officer: "General-mayor R. Zeynalov", unread: false, history: [{ sender: "BDYPİ Rəisi", text: "Paytaxt yollarında reydlərə başlamaq üçün icazə istəyirik. Başlayaq?" }] },
            { id: "bca", name: "Baş Cinayət Axtarış İdarəsi", sub: "BCAİ", officer: "General-mayor K. Qasımov", unread: false, history: [{ sender: "BCAİ Rəisi", text: "Axtarışda olan şəbəkənin yeri müəyyəndir. Əməliyyat keçirilsin?" }] },
            { id: "dtx", name: "Dövlət Təhlükəsizliyi Xidməti (DTX)", sub: "Xüsusi Xidmət", officer: "DTX Rəhbərliyi", unread: false, history: [{ sender: "DTX", text: "Məxfi kəşfiyyat məlumatı: Şəhərdə şübhəli şəxslər qeydə alınıb. Birgə əməliyyata icazə verirsiniz?" }] },
            { id: "fhn", name: "Fövqəladə Hallar Nazirliyi (FHN)", sub: "Fövqəladə Rejim", officer: "FHN Rəhbərliyi", unread: false, history: [{ sender: "FHN", text: "Sənaye zonasında yanğın riski var. Polis nizamnaməsi tətbiq edilsin?" }] },
            { id: "mn", name: "Müdafiə Nazirliyi (MN)", sub: "Ordu Rəhbərliyi", officer: "MN Qərargahı", unread: false, history: [{ sender: "MN", text: "Sərhədyanı rayonlarda təhlükəsizlik zolağı gücləndirilsin?" }] },
            { id: "dsx", name: "Dövlət Sərhəd Xidməti (DSX)", sub: "Sərhəd Nəzarəti", officer: "DSX Komandanlığı", unread: false, history: [{ sender: "DSX", text: "Qanunsuz keçid cəhdi oldu. DİN tərəfindən dəstək qüvvəsi göndərilsin?" }] },
            { id: "dq", name: "Daxili Qoşunlar", sub: "DİN-in Hərbi Birləşməsi", officer: "DQ Komandanı", unread: false, history: [{ sender: "DQ Komandanı", text: "Daxili Qoşunların xüsusi təyinatlıları hazır vəziyyətdədir." }] },
            { id: "prokuror", name: "Baş Prokurorluq", sub: "Hüquq və Nəzarət", officer: "Baş Prokurorluq", unread: false, history: [{ sender: "Prokurorluq", text: "Həbs qətimkan tədbirləri ilə bağlı sənədlər imzanızı gözləyir." }] },
            { id: "court", name: "Məhkəmə Hakimiyyəti", sub: "Ədliyyə", officer: "Məhkəmə Heyəti", unread: false, history: [{ sender: "Məhkəmə", text: "Saxlanılan şübhəlilərin məhkəmə prosesi təyin olundu." }] },
            { id: "tabib", name: "TƏBİB", sub: "Səhiyyə Xidməti", officer: "TƏBİB Rəhbərliyi", unread: false, history: [{ sender: "TƏBİB", text: "DİN Hospitalı üçün yeni avadanlıqlar gətirildi." }] },
            { id: "xks", name: "Xarici Kəşfiyyat Xidməti", sub: "Xarici Təhlükəsizlik", officer: "XKX Əməkdaşı", unread: false, history: [{ sender: "XKX", text: "Xarici ölkədə axtarışda olan kriminallarla bağlı xüsusi hesabat." }] },
            { id: "bit", name: "Baş İctimai Təhlükəsizlik İdarəsi", sub: "BİTİ", officer: "Polkovnik T. Həsənov", unread: false, history: [{ sender: "BİTİ Rəisi", text: "Aksiyaların qarşısını almaq üçün təhlükəsizlik planı hazırdır." }] },
            { id: "bnm", name: "Baş Narkotiklərlə Mübarizə İdarəsi", sub: "BNMİ", officer: "General-mayor F. Əliyev", unread: false, history: [{ sender: "BNMİ Rəisi", text: "Narkotik tranzitinin qarşısı alındı. Mətbuata açıqlama verilsin?" }] },
            { id: "cpa", name: "Əlahiddə Çevik Polis Alayı", sub: "ÇPA", officer: "Polkovnik E. Hüseynov", unread: false, history: [{ sender: "ÇPA Komandiri", text: "ÇPA heyəti hazır vəziyyətdədir." }] },
            { id: "academy", name: "Polis Akademiyası", sub: "Təhsil Mərkəzi", officer: "General-mayor N. Əhmədov", unread: false, history: [{ sender: "Akademiya Rəisi", text: "Məzunların təyinatı siyahısı təsdiq edilsin?" }] },
            { id: "bspi", name: "Bakı Şəhər Baş Polis İdarəsi", sub: "BŞBPİ", officer: "General-leytenant S. Nəzərov", unread: false, history: [{ sender: "BŞBPİ Rəisi", text: "Bakı üzrə operativ vəziyyət tam nəzarətdədir." }] },
            { id: "press", name: "DİN Mətbuat Xidməti", sub: "Media", officer: "Polkovnik A. Zahidov", unread: false, history: [{ sender: "Mətbuat Xidməti", text: "Son hadisələrlə bağlı jurnalistlərin sualları cavablandırılsın?" }] },
            { id: "dating_1", name: "Leman (XİN Əməkdaşı)", sub: "Şəxsi Məxluqat", officer: "Diplomat", unread: true, history: [{ sender: "Leman", text: "Salam cənab Nazir. Şəhərdə istirahət etmək üçün vaxtınız olacaq bu gün? 😊" }] }
        ];

        let state = {
            loggedIn: false,
            activeChatId: "pa",
            chats: initialChats,
            bLegal: 15000,
            bBlack: 120000,
            rep: 95
        };

        function load() {
            const data = localStorage.getItem("din_state_v2");
            if (data) state = JSON.parse(data);
        }

        function save() {
            localStorage.setItem("din_state_v2", JSON.stringify(state));
        }

        function login() {
            const u = document.getElementById("login-user").value;
            const p = document.getElementById("login-pass").value;
            if (u === AUTH_U && p === AUTH_P) {
                state.loggedIn = true;
                document.getElementById("login-overlay").style.display = "none";
                save();
                init();
            } else {
                document.getElementById("login-err").style.display = "block";
            }
        }

        function init() {
            renderChats();
            renderMessages();
            updateUI();
            setInterval(() => {
                document.getElementById("clock").innerText = new Date().toLocaleTimeString('az-AZ');
            }, 1000);
        }

        function updateUI() {
            document.getElementById("b-legal").innerText = state.bLegal.toLocaleString() + " AZN";
            document.getElementById("b-black").innerText = state.bBlack.toLocaleString() + " AZN";
            document.getElementById("rep").innerText = state.rep + "%";
        }

        function renderChats() {
            const el = document.getElementById("chat-list");
            el.innerHTML = "";
            state.chats.forEach(c => {
                const d = document.createElement("div");
                d.className = `chat-item ${c.id === state.activeChatId ? 'active' : ''}`;
                d.onclick = () => selectChat(c.id);
                d.innerHTML = `
                    <div>
                        <div class="chat-name">${c.name}</div>
                        <div class="chat-sub">${c.officer}</div>
                    </div>
                    <div class="unread-dot ${c.unread ? 'active' : ''}"></div>
                `;
                el.appendChild(d);
            });
        }

        function selectChat(id) {
            state.activeChatId = id;
            const c = state.chats.find(x => x.id === id);
            if (c) c.unread = false;
            save();
            renderChats();
            renderMessages();

            // MOBİL AÇILIŞ
            document.getElementById("chat-view").classList.add("active-view");
        }

        function closeChatMobile() {
            document.getElementById("chat-view").classList.remove("active-view");
        }

        function renderMessages() {
            const c = state.chats.find(x => x.id === state.activeChatId);
            if (!c) return;

            document.getElementById("chat-title").innerText = c.name;
            document.getElementById("chat-sub").innerText = `${c.sub} | ${c.officer}`;

            const box = document.getElementById("msg-area");
            box.innerHTML = "";

            c.history.forEach(m => {
                const div = document.createElement("div");
                div.className = `msg ${m.sender === "Mən" ? 'sent' : 'received'}`;
                div.innerHTML = m.sender !== "Mən" ? `<div class="msg-sender">${m.sender}</div>${m.text}` : m.text;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById("msg-input");
            const txt = input.value.trim();
            if (!txt) return;

            const c = state.chats.find(x => x.id === state.activeChatId);
            c.history.push({ sender: "Mən", text: txt });
            input.value = "";

            renderMessages();
            save();

            // AĞILLI BOT CAVAB MEXANİZMİ
            setTimeout(() => {
                processSmartBotResponse(c, txt);
            }, 1000);
        }

        function processSmartBotResponse(chat, userTxt) {
            const txt = userTxt.toLowerCase();
            let reply = "";

            // "XEYR" VƏ YA İMTİNA MƏNTİQİ
            if (txt.includes("xeyr") || txt.includes("yox") || txt.includes("imtina") || txt.includes("dayandır") || txt.includes("gözlə")) {
                if (chat.id === "bdypi") reply = "Anlaşıldı cənab Nazir, YPX reydləri təxirə salındı. Məntəqələr adi rejimdə davam edir.";
                else if (chat.id === "dtx") reply = "Bildişiniz kimi olsun. DTX əməliyyat qrupu gözləmə mövqeyinə keçdi.";
                else if (chat.id === "bca") reply = "Baş üstünə cənab Nazir, əməliyyat dayandırıldı. Yeni tapşırığınızı gözləyirik.";
                else if (chat.id === "press") reply = "Aydın oldu, mətbuata heç bir rəsmi məlumat verilməyəcək.";
                else if (chat.id === "dating_1") reply = "Anlayıram, işləriniz çoxdur görünür... Başqa vaxt görüşərik.";
                else reply = "Anlaşıldı cənab Nazir, qərarınız qəbul edildi. Tapşırığınız ləğv olundu.";
            } 
            // "BƏLİ" VƏ YA TƏSDİQ MƏNTİQİ
            else if (txt.includes("bəli") || txt.includes("hə") || txt.includes("başla") || txt.includes("icazə verirəm") || txt.includes("icra et")) {
                if (chat.id === "bdypi") reply = "Əmr icra olunur! BDYPİ heyəti şəhər üzrə genişmiqyaslı reydlərə başladı.";
                else if (chat.id === "dtx") reply = "DİN və DTX xüsusi təyinatlıları ortaq əməliyyata start verdi.";
                else if (chat.id === "press") reply = "Rəsmi bəyanat DİN-in rəsmi kanallarında yayımlandı.";
                else reply = "Baş üstünə cənab Nazir! Əmriniz dərhal icraya yönəldildi.";
            } 
            // ŞƏXSİ KABİNET / EVİM
            else if (chat.id === "home") {
                if (txt.includes("maşın") || txt.includes("kortej")) reply = "Kortejiniz və zirehli xidməti avtomobiliniz qapıda gözləyir.";
                else if (txt.includes("istirahət") || txt.includes("yat")) reply = "İstirahət rejiminiz aktiv edildi. Fövqəladə hallardan başqa narahat edilməyəcəksiniz.";
                else reply = "Şəxsi kabinetinizdə hər şey qaydasındadır, cənab Nazir.";
            }
            // RÜŞVƏT VƏ PUL MƏNTİQİ
            else if (txt.includes("pul") || txt.includes("rüşvət") || txt.includes("fond")) {
                reply = "Xüsusi hesabınıza 30,000 AZN məbləğində daxilolma oldu.";
                state.bBlack += 30000;
                updateUI();
            } 
            // ÜMUMİ DİNAMİK CAVAB
            else {
                reply = `"${userTxt}" tapşırığınız qeydə alındı. Nəticə barədə sizə məruzə olunacaq.`;
            }

            chat.history.push({ sender: chat.officer, text: reply });
            save();
            renderMessages();
        }

        // KADR İDARƏETMƏSİ
        function openModal() {
            const c = state.chats.find(x => x.id === state.activeChatId);
            document.getElementById("modal-officer").value = c.officer;
            document.getElementById("modal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modal").style.display = "none";
        }

        function toggleKadrInput() {
            const v = document.getElementById("modal-action").value;
            document.getElementById("modal-new-name").style.display = v === "replace" ? "block" : "none";
        }

        function applyKadr() {
            const c = state.chats.find(x => x.id === state.activeChatId);
            const act = document.getElementById("modal-action").value;

            if (act === "fire") {
                c.officer = "VAKANT (Sərəncamda)";
                c.history.push({ sender: "Sistem", text: "🔴 Rəis vəzifəsindən azad olundu və sərəncama götürüldü." });
            } else if (act === "promote") {
                c.history.push({ sender: "Sistem", text: "⭐ Zabitin rütbəsi vaxtından əvvəl bir pillə qaldırıldı." });
            } else if (act === "replace") {
                const newN = document.getElementById("modal-new-name").value || "Polkovnik N. Həsənov";
                c.officer = newN;
                c.history.push({ sender: "Sistem", text: `🟢 Yeni təyinat verildi: ${newN}` });
            }

            save();
            renderChats();
            renderMessages();
            closeModal();
        }

        window.onload = function() {
            load();
            if (state.loggedIn) {
                document.getElementById("login-overlay").style.display = "none";
                init();
            }
        };
    </script>
</body>
</html>
