<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOKT - Onlayn Tez Kredit</title>
  <!-- Three.js (Arxa fon 3D animasiyasi üçün) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tailwind CSS (Modern interfeys üçün) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen justify-between items-center relative">

  <!-- DƏHŞƏT ƏLA ARXA FON 3D ANIMASIYASI CANVAS -->
  <canvas id="bg-canvas"></canvas>

  <!-- Navigation -->
  <nav class="w-full max-w-6xl mx-auto p-6 flex justify-between items-center z-10">
    <div class="text-2xl font-black tracking-wider text-cyan-400">EXPRESS<span class="text-white">KREDİT</span></div>
    <a href="admin.html" target="_blank" class="text-sm px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 transition border border-white/10">Admin Panel</a>
  </nav>

  <!-- Main Section -->
  <main class="w-full max-w-xl p-4 my-auto z-10">
    <div class="glass-card rounded-2xl p-6 md:p-8">
      <h1 class="text-2xl font-bold text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
        Onlayn Mikro Kredit
      </h1>
      <p class="text-center text-gray-400 text-sm mb-6">45 günədək komissiyasız rahat borc imkanı</p>

      <!-- Calculator Section -->
      <div class="bg-slate-900/60 p-5 rounded-xl mb-6 border border-slate-700/50">
        <div class="flex justify-between items-center mb-2">
          <span class="text-gray-300 text-sm font-medium">Məbləğ seçin:</span>
          <span id="amount-label" class="text-2xl font-extrabold text-cyan-400">100 ₼</span>
        </div>
        
        <input type="range" id="credit-slider" min="0" max="16" step="1" value="8" 
               class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-400">

        <div class="grid grid-cols-2 gap-4 mt-6 pt-4 border-t border-slate-700/60 text-center">
          <div>
            <span class="text-xs text-gray-400 block">Müddət</span>
            <span class="text-base font-semibold text-white">45 günədək</span>
          </div>
          <div>
            <span class="text-xs text-gray-400 block">Qaytarılacaq Məbləğ</span>
            <span id="return-label" class="text-xl font-black text-green-400">120 ₼</span>
          </div>
        </div>
        <p class="text-[11px] text-amber-400/80 text-center mt-3">
          *45 gündən sonra gecikdirilən hər gün üçün +2 ₼ cərimə hesablanacaq.
        </p>
      </div>

      <!-- Application Form -->
      <form id="loan-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Ad, Soyad</label>
          <input type="text" id="fullname" required placeholder="Məs: Əli Əliyev"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">FİN Kod</label>
            <input type="text" id="fin" required maxlength="7" placeholder="7 simvoldan ibarət"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white uppercase focus:outline-none focus:border-cyan-400">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-300 mb-1">Mobil Nömrə</label>
            <input type="tel" id="phone" required placeholder="0501234567"
                   class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Bank Kart Nömrəsi (Kreditin vurulması üçün)</label>
          <input type="text" id="card" required placeholder="4127 **** **** 1234" maxlength="16"
                 class="w-full bg-slate-800/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>

        <button type="submit" id="submit-btn" 
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 font-bold rounded-lg transition transform active:scale-95 shadow-lg shadow-cyan-500/20">
          TƏSDİQLƏ VƏ KREDİTİ AL
        </button>
      </form>
      
      <div id="status-msg" class="hidden mt-4 text-center text-sm font-medium"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full text-center py-4 text-xs text-gray-500 z-10">
    &copy; 2026 ExpressKredit BOKT. Bütün hüquqlar qorunur.
  </footer>

  <!-- Firebase SDK Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIXME: Öz Firebase Konfiqurasiya Məlumatlarınızı bura daxil edin!
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "SENDER_ID",
      appId: "APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Məbləğlər cədvəli
    const steps = [
      { amount: 20, returnVal: 24 },
      { amount: 30, returnVal: 36 },
      { amount: 40, returnVal: 48 },
      { amount: 50, returnVal: 60 },
      { amount: 60, returnVal: 72 },
      { amount: 70, returnVal: 84 },
      { amount: 80, returnVal: 96 },
      { amount: 90, returnVal: 108 },
      { amount: 100, returnVal: 120 },
      { amount: 150, returnVal: 180 },
      { amount: 200, returnVal: 240 },
      { amount: 250, returnVal: 300 },
      { amount: 300, returnVal: 360 },
      { amount: 350, returnVal: 420 },
      { amount: 400, returnVal: 480 },
      { amount: 450, returnVal: 540 },
      { amount: 500, returnVal: 600 }
    ];

    const slider = document.getElementById('credit-slider');
    const amountLabel = document.getElementById('amount-label');
    const returnLabel = document.getElementById('return-label');
    const loanForm = document.getElementById('loan-form');
    const statusMsg = document.getElementById('status-msg');

    let currentSelected = steps[8]; // Default 100 AZN

    slider.addEventListener('input', (e) => {
      currentSelected = steps[e.target.value];
      amountLabel.textContent = currentSelected.amount + " ₼";
      returnLabel.textContent = currentSelected.returnVal + " ₼";
    });

    // Firebase-ə müraciət göndərmək
    loanForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Müraciət göndərilir...";

      try {
        await addDoc(collection(db, "loans"), {
          fullname: document.getElementById('fullname').value,
          fin: document.getElementById('fin').value.toUpperCase(),
          phone: document.getElementById('phone').value,
          card: document.getElementById('card').value,
          takenAmount: currentSelected.amount,
          baseReturnAmount: currentSelected.returnVal,
          status: "Gözləmədə", // Gözləmədə, Təsdiqləndi, İmtina
          createdAt: serverTimestamp(),
          dueDateDays: 45
        });

        statusMsg.className = "mt-4 text-center text-sm font-medium text-green-400";
        statusMsg.textContent = "Müraciətiniz qəbul olundu! Tezliklə sizinlə əlaqə saxlanılacaq.";
        statusMsg.classList.remove('hidden');
        loanForm.reset();
      } catch (err) {
        statusMsg.className = "mt-4 text-center text-sm font-medium text-red-400";
        statusMsg.textContent = "Xəta baş verdi: " + err.message;
        statusMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "TƏSDİQLƏ VƏ KREDİTİ AL";
      }
    });
  </script>

  <!-- Three.js 3D Background Animation Code -->
  <script>
    const canvas = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Particle Wave Grid
    const numParticles = 2500;
    const positions = new Float32Array(numParticles * 3);
    const scales = new Float32Array(numParticles);

    let i = 0, j = 0;
    const AMOUNTX = 50, AMOUNTY = 50;
    const SEPARATION = 100;

    for (let ix = 0; ix < AMOUNTX; ix++) {
      for (let iy = 0; iy < AMOUNTY; iy++) {
        positions[i] = ix * SEPARATION - ((AMOUNTX * SEPARATION) / 2);
        positions[i + 1] = 0;
        positions[i + 2] = iy * SEPARATION - ((AMOUNTY * SEPARATION) / 2);
        i += 3;
      }
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.PointsMaterial({
      color: 0x00f0ff,
      size: 4,
      transparent: true,
      opacity: 0.7
    });

    const particles = new THREE.Points(geometry, material);
    scene.add(particles);

    camera.position.y = 400;
    camera.position.z = 800;
    camera.lookAt(scene.position);

    let count = 0;

    function animate() {
      requestAnimationFrame(animate);

      const positions = particles.geometry.attributes.position.array;
      let i = 0;

      for (let ix = 0; ix < AMOUNTX; ix++) {
        for (let iy = 0; iy < AMOUNTY; iy++) {
          positions[i + 1] = (Math.sin((ix + count) * 0.3) * 50) + (Math.sin((iy + count) * 0.5) * 50);
          i += 3;
        }
      }

      particles.geometry.attributes.position.needsUpdate = true;
      particles.rotation.y += 0.001;
      count += 0.05;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
